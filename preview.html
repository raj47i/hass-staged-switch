<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staged Switch preview</title>
    <style>
      :root {
        --primary-color: #03a9f4;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --card-background-color: #fff;
        --ha-card-background: #fff;
        --state-inactive-color: #9e9e9e;
        --state-active-color: #fdd835;
        --state-icon-active-color: #fdd835;
        --state-switch-active-color: #fdd835;
        --state-light-active-color: #fdd835;
      }
      body {
        margin: 0;
        font-family: Roboto, system-ui, sans-serif;
        background: #f2f4f6;
        color: #212121;
      }
      .app-header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        height: 56px;
        padding: 0 20px;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        font-size: 20px;
        font-weight: 400;
      }
      .view {
        display: grid;
        gap: 24px;
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      .shot {
        overflow: hidden;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      }
      .shot img {
        display: block;
        width: 100%;
        height: auto;
      }
      .section-title {
        margin: 8px 4px 0;
        font-size: 16px;
        font-weight: 500;
      }
      .muted {
        margin: 0 4px;
        font-size: 13px;
        color: #727272;
      }
      ha-card {
        display: block;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      }
      .cards {
        display: grid;
        gap: 16px;
      }
    </style>
    <script>
      const PATHS = {
        "mdi:power":
          "M16.56 5.44 15.11 6.89A6.18 6.18 0 0 1 18 11.72a6.14 6.14 0 1 1-12.28 0 6.18 6.18 0 0 1 2.89-4.83L7.16 5.44A8.16 8.16 0 0 0 3.72 11.72a8.15 8.15 0 1 0 16.3 0 8.16 8.16 0 0 0-3.46-6.28M11.86 3.87h1v6.85h-1z",
        "mdi:toggle-switch":
          "M17 7H7a5 5 0 0 0 0 10h10a5 5 0 0 0 0-10m0 8a3 3 0 1 1 0-6 3 3 0 0 1 0 6",
        "mdi:lightbulb":
          "M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7M9 21v1a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9z",
        "mdi:fan":
          "M12 11a1 1 0 1 0 1 1 1 1 0 0 0-1-1m.5-9C16.14 2 19 4.69 19 8c0 1.55-.58 3-1.56 4.1l1.66 3.61A8.28 8.28 0 0 1 12.5 22C7.81 22 4 18.42 4 14c0-2.39 1.14-4.52 2.91-5.91L8.5 4.5A7.47 7.47 0 0 1 12.5 2z",
        "mdi:circle-medium":
          "M12 8a4 4 0 1 0 4 4 4 4 0 0 0-4-4z",
      };
      class HaIcon extends HTMLElement {
        set icon(value) {
          const d = PATHS[value] || PATHS["mdi:power"];
          this.innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="${d}"></path></svg>`;
        }
      }
      class HaStateIcon extends HTMLElement {
        set hass(_value) {}
        set icon(value) {
          this._icon = value;
          this._render();
        }
        set stateObj(value) {
          this._stateObj = value;
          this._render();
        }
        _render() {
          const entityId = this._stateObj?.entity_id || "";
          const icon =
            this._icon ||
            (entityId.startsWith("fan.")
              ? "mdi:fan"
              : entityId.startsWith("light.")
                ? "mdi:lightbulb"
                : "mdi:toggle-switch");
          const d = PATHS[icon] || PATHS["mdi:power"];
          this.innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="${d}"></path></svg>`;
        }
      }
      customElements.define("ha-icon", HaIcon);
      customElements.define("ha-state-icon", HaStateIcon);
    </script>
    <script type="module" src="/dist/staged-switch-card.js"></script>
  </head>
  <body>
    <header class="app-header">Overview</header>
    <main class="view">
      <section>
        <h1 class="section-title">Dashboard preview</h1>
        <p class="muted">What the card looks like on a Home Assistant dashboard.</p>
        <figure class="shot">
          <img
            src="images/staged-switch-card.png"
            alt="Staged Switch Card with Power, five stages, and two rows of entity chips"
          />
        </figure>
      </section>
      <section>
        <h2 class="section-title">Live cards</h2>
        <p class="muted">Same control, interactive in this browser.</p>
        <div class="cards">
          <staged-switch-card id="many"></staged-switch-card>
          <staged-switch-card id="card"></staged-switch-card>
        </div>
      </section>
    </main>
    <script type="module">
      const states = {
        "input_number.many_stage": {
          entity_id: "input_number.many_stage",
          state: "4",
          attributes: { min: 0, max: 5, step: 1 },
          last_changed: "",
          last_updated: "",
        },
        "input_number.patio_stage": {
          entity_id: "input_number.patio_stage",
          state: "2",
          attributes: { min: 0, max: 3, step: 1 },
          last_changed: "",
          last_updated: "",
        },
        "input_boolean.patio_power": {
          entity_id: "input_boolean.patio_power",
          state: "on",
          attributes: {},
          last_changed: "",
          last_updated: "",
        },
        "switch.fan": {
          entity_id: "switch.fan",
          state: "on",
          attributes: { friendly_name: "Fan" },
          last_changed: "",
          last_updated: "",
        },
        "light.string": {
          entity_id: "light.string",
          state: "on",
          attributes: { friendly_name: "String lights" },
          last_changed: "",
          last_updated: "",
        },
        "switch.heater": {
          entity_id: "switch.heater",
          state: "off",
          attributes: { friendly_name: "Heater" },
          last_changed: "",
          last_updated: "",
        },
        "light.lamp": {
          entity_id: "light.lamp",
          state: "off",
          attributes: { friendly_name: "Lamp" },
          last_changed: "",
          last_updated: "",
        },
        "light.porch": {
          entity_id: "light.porch",
          state: "on",
          attributes: { friendly_name: "Porch" },
          last_changed: "",
          last_updated: "",
        },
        "switch.pump": {
          entity_id: "switch.pump",
          state: "off",
          attributes: { friendly_name: "Pump" },
          last_changed: "",
          last_updated: "",
        },
        "fan.patio": {
          entity_id: "fan.patio",
          state: "on",
          attributes: { friendly_name: "Patio fan" },
          last_changed: "",
          last_updated: "",
        },
        "switch.hidden": {
          entity_id: "switch.hidden",
          state: "on",
          attributes: { friendly_name: "Hidden relay" },
          last_changed: "",
          last_updated: "",
        },
        "light.deck": {
          entity_id: "light.deck",
          state: "off",
          attributes: { friendly_name: "Deck" },
          last_changed: "",
          last_updated: "",
        },
      };

      const refresh = () => {
        const next = { ...hass, states };
        card.hass = next;
        many.hass = next;
      };

      const card = document.getElementById("card");
      const many = document.getElementById("many");
      const hass = {
        language: "en",
        localize: (key) => key,
        states,
        async callService(_domain, service, data) {
          const ids = Array.isArray(data?.entity_id)
            ? data.entity_id
            : data?.entity_id
              ? [data.entity_id]
              : [];
          if (ids.includes("input_number.patio_stage")) {
            states["input_number.patio_stage"].state = String(data.value);
          } else if (ids.includes("input_number.many_stage")) {
            states["input_number.many_stage"].state = String(data.value);
          } else if (ids.includes("input_boolean.patio_power")) {
            states["input_boolean.patio_power"].state =
              service === "turn_on" ? "on" : "off";
          } else {
            ids.forEach((id) => {
              if (states[id]) {
                states[id].state = service === "turn_on" ? "on" : "off";
              }
            });
          }
          refresh();
        },
      };

      card.setConfig({
        type: "custom:staged-switch-card",
        title: "Patio",
        entity: "input_number.patio_stage",
        power_entity: "input_boolean.patio_power",
        stage_names: ["Off", "Fan", "String lights", "Heater"],
        switches: ["switch.fan", "light.string", "switch.heater"],
      });

      many.setConfig({
        type: "custom:staged-switch-card",
        title: "Seven visible, one hidden",
        entity: "input_number.many_stage",
        power_entity: "input_boolean.patio_power",
        switches: [
          "switch.fan",
          "light.string",
          "switch.heater",
          "light.lamp",
          { entity: "switch.hidden", hide: true },
          "light.porch",
          "switch.pump",
          "fan.patio",
        ],
      });
      refresh();
    </script>
  </body>
</html>
